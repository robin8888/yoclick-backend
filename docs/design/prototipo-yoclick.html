/* Movimiento: la familia motion no existe en tokens.json, vive aquí */

function extractColor(src,cb){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=c.height=48;var x=c.getContext('2d');x.drawImage(img,0,0,48,48);var d;try{d=x.getImageData(0,0,48,48).data}catch(e){cb(null);return}var bins={};for(var i=0;i<d.length;i+=4){if(d[i+3]<128)continue;var r=d[i],g=d[i+1],b=d[i+2];var mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<40)continue;var k=(r>>4)+','+(g>>4)+','+(b>>4);bins[k]=bins[k]||{n:0,r:0,g:0,b:0};bins[k].n++;bins[k].r+=r;bins[k].g+=g;bins[k].b+=b}var best=null;for(var k2 in bins){if(!best||bins[k2].n>best.n)best=bins[k2]}if(!best){cb(null);return}cb(toHex([best.r/best.n,best.g/best.n,best.b/best.n]))};img.onerror=function(){cb(null)};img.src=src}
