info:
  title: Yoclick API
  description: API multi-centro de reservas en marca blanca. Contrato canónico para la app.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: https://api.yoclick.app
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
            required:
              - path
              - code
      required:
        - type
        - title
        - status
        - code
        - traceId
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        consents:
          type: object
          properties:
            privacy:
              type: boolean
            terms:
              type: boolean
            marketing:
              default: false
              type: boolean
          required:
            - privacy
            - terms
          additionalProperties: false
      required:
        - email
