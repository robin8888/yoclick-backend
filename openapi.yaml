openapi: 3.0.0
paths:
  /v1/auth/register:
    post:
      operationId: auth_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSentResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Crea una cuenta y envía un código de 6 dígitos al correo. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/email/verify:
    post:
      operationId: auth_verify_email
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerifiedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Confirma el correo con el código de 6 dígitos (5 intentos, 15 minutos).
      tags:
        - auth
  /v1/auth/email/resend:
    post:
      operationId: auth_resend_email_verification
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendEmailVerificationRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSentResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Reenvía el código. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: auth_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MfaLoginResponseDto"
                  - $ref: "#/components/schemas/MfaChallengeResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: "Inicia sesión con correo y contraseña. Un correo inexistente, una contraseña errónea y una cuenta bloqueada responden igual. Con segundo factor activo devuelve un desafío (`status: mfa_required`) en lugar de la sesión."
      tags:
        - auth
  /v1/auth/mfa/verify:
    post:
      operationId: auth_verify_mfa
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaLoginResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Completa el inicio de sesión con el código de la app de autenticación o un código de recuperación. Cada código de la app sirve una sola vez.
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: auth_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Rota el refresh token y devuelve tokens nuevos. Reutilizar un token ya rotado revoca toda la sesión de ese dispositivo. Conserva el nivel de autenticación de la sesión (con o sin segundo factor).
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: auth_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cierra la sesión de este dispositivo, o de todos con `everywhere`.
      tags:
        - auth
  /v1/auth/password/forgot:
    post:
      operationId: auth_forgot_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Envía un código de 6 dígitos para cambiar la contraseña. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/password/reset:
    post:
      operationId: auth_reset_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Cambia la contraseña con el código (30 minutos, 5 intentos) y cierra la sesión en todos los dispositivos.
      tags:
        - auth
  /v1/me/mfa:
    get:
      operationId: mfa_get_status
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Si el segundo factor está activo y cuántos códigos de recuperación quedan.
      tags:
        - mfa
  /v1/me/mfa/totp/setup:
    post:
      operationId: mfa_setup_totp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaSetupRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: "Empieza a configurar la app de autenticación: devuelve el secreto y el URI para el QR. No cuenta hasta confirmarlo."
      tags:
        - mfa
  /v1/me/mfa/totp/confirm:
    post:
      operationId: mfa_confirm_totp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Activa el segundo factor con el primer código de la app y entrega diez códigos de recuperación (una sola vez).
      tags:
        - mfa
  /v1/me/mfa/disable:
    post:
      operationId: mfa_disable
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaProofRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Desactiva el segundo factor. Pide la contraseña y un código. No disponible para propietarias y administradoras.
      tags:
        - mfa
  /v1/me/mfa/recovery-codes/regenerate:
    post:
      operationId: mfa_regenerate_recovery_codes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaProofRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegeneratedRecoveryCodesResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Sustituye los códigos de recuperación por diez nuevos. Pide la contraseña y un código.
      tags:
        - mfa
  /v1/me:
    get:
      operationId: me_get_profile
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Mi perfil.
      tags:
        - me
    patch:
      operationId: me_update_profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia mi nombre, teléfono, fecha de nacimiento o idioma. El correo no se cambia aquí.
      tags:
        - me
    delete:
      operationId: me_delete_account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Elimina mi cuenta (Apple 5.1.1(v), RGPD art. 17). Pide la contraseña y escribir ELIMINAR. Irreversible.
      tags:
        - me
  /v1/me/memberships:
    get:
      operationId: me_list_memberships
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMembershipsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Mis centros, con su marca, para cambiar de centro.
      tags:
        - me
  /v1/me/consents:
    get:
      operationId: me_get_consents
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyConsentsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: El estado vigente de cada consentimiento.
      tags:
        - me
    put:
      operationId: me_set_consent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetConsentRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyConsentsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Concede o retira un consentimiento opcional (marketing, imagen). Queda constancia de cada cambio.
      tags:
        - me
  /v1/me/password:
    post:
      operationId: me_change_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia la contraseña (pide la actual) y cierra la sesión en todos los dispositivos, este incluido.
      tags:
        - me
  /v1/me/data-export:
    post:
      operationId: me_export_data
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDataRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataExportResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Descarga todos mis datos en JSON (RGPD arts. 15 y 20). Pide la contraseña.
      tags:
        - me
  /v1/join/code/{code}:
    get:
      operationId: join_find_center_by_code
      parameters:
        - name: code
          required: true
          in: path
          schema:
            minLength: 1
            maxLength: 16
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: El centro que corresponde a un código de unión. Un código desconocido responde 404 JOIN_CODE_INVALID.
      tags:
        - join
  /v1/join/search:
    get:
      operationId: join_search_centers
      parameters:
        - name: q
          required: false
          in: query
          schema:
            minLength: 2
            maxLength: 80
            type: string
        - name: lat
          required: false
          in: query
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: lng
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterSearchResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Busca entre los centros que salen en el directorio, por texto y, si se envía ubicación, por cercanía.
      tags:
        - join
  /v1/join/{centerId}:
    post:
      operationId: join_center
      parameters:
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCenterRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Te une al centro como cliente. Un centro privado exige su código de unión; uno listado, no. Comprueba el límite de clientes del plan.
      tags:
        - join
  /v1/onboarding/centers:
    post:
      operationId: onboarding_create_center
      parameters:
        - name: Idempotency-Key
          in: header
          description: UUID por intención del usuario
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCenterRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Da de alta un centro en prueba de 14 días; quien lo crea queda como propietario. Repetir la misma Idempotency-Key devuelve el mismo centro.
      tags:
        - onboarding
  /v1/centers/{centerId}/team:
    get:
      operationId: team_list
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Quienes trabajan en el centro.
      tags:
        - team
  /v1/centers/{centerId}/team/{membershipId}:
    patch:
      operationId: team_update_member
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: membershipId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia rol, permisos, cargo o estado de alguien del equipo. La propietaria no se toca; solo ella gestiona administradoras.
      tags:
        - team
  /v1/centers/{centerId}/invitations:
    get:
      operationId: invitations_list_pending
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingInvitationsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Invitaciones pendientes.
      tags:
        - team
    post:
      operationId: invitations_create
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Invita por correo a un cliente, a alguien del equipo o a otra administradora. El personal solo invita clientes. El código llega por correo, sin enlaces.
      tags:
        - team
  /v1/centers/{centerId}/invitations/{invitationId}:
    delete:
      operationId: invitations_revoke
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: invitationId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Anula una invitación pendiente.
      tags:
        - team
  /v1/join/invitations/{code}:
    get:
      operationId: join_get_invitation
      parameters:
        - name: code
          required: true
          in: path
          schema:
            minLength: 1
            maxLength: 24
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Centro y rol de una invitación, con el correo ofuscado. Un código inválido, caducado o usado responde 404 INVITATION_INVALID.
      tags:
        - join
  /v1/join/invitations/{code}/accept:
    post:
      operationId: join_accept_invitation
      parameters:
        - name: code
          required: true
          in: path
          schema:
            minLength: 1
            maxLength: 24
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitationResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Acepta la invitación con la cuenta cuyo correo coincide. Sirve una sola vez; nunca rebaja el rol de quien ya está dentro.
      tags:
        - join
  /v1/centers/{centerId}/branding:
    get:
      operationId: centers_get_branding
      parameters:
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterBrandingResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Nombre, sector y color de un centro. Público y cacheable cinco minutos.
      tags:
        - centers
  /v1/centers/{centerId}:
    get:
      operationId: centers_get_settings
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterSettingsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Datos, horario, festivos y política de cancelación del centro. Devuelve ETag.
      tags:
        - centers
    patch:
      operationId: centers_update_settings
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: If-Match
          in: header
          description: El ETag que se leyó
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCenterSettingsRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterSettingsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: "Modifica datos del centro. Exige If-Match: 428 si falta, 412 si otra persona lo cambió antes."
      tags:
        - centers
  /health:
    get:
      operationId: health_check_liveness
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseDto"
      summary: Comprueba que la API está viva. No requiere autenticación.
      tags:
        - health
info:
  title: Yoclick API
  description: API multi-centro de reservas en marca blanca. Contrato canónico para la app.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: https://api.yoclick.app
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
            required:
              - path
              - code
      required:
        - type
        - title
        - status
        - code
        - traceId
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        consents:
          type: object
          properties:
            privacy:
              type: boolean
            terms:
              type: boolean
            marketing:
              default: false
              type: boolean
          required:
            - privacy
            - terms
          additionalProperties: false
      required:
        - email
        - password
        - fullName
        - consents
      additionalProperties: false
    VerificationSentResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - verification_sent
      required:
        - status
      additionalProperties: false
    VerifyEmailRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        code:
          type: string
          pattern: ^\d{6}$
      required:
        - email
        - code
      additionalProperties: false
    EmailVerifiedResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - verified
      required:
        - status
      additionalProperties: false
    ResendEmailVerificationRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
      required:
        - email
      additionalProperties: false
    MfaLoginResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            email:
              type: string
            fullName:
              type: string
          required:
            - id
            - email
            - fullName
          additionalProperties: false
      required:
        - status
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - user
      additionalProperties: false
    MfaChallengeResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - mfa_required
        mfaToken:
          type: string
        mfaTokenExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - status
        - mfaToken
        - mfaTokenExpiresAt
      additionalProperties: false
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - email
        - password
      additionalProperties: false
    MfaVerifyRequestDto:
      type: object
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 2048
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
          minLength: 8
          maxLength: 24
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - mfaToken
      additionalProperties: false
    RefreshRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - refreshToken
      additionalProperties: false
    RefreshResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      additionalProperties: false
    LogoutRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        everywhere:
          default: false
          type: boolean
      additionalProperties: false
    ForgotPasswordRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
      required:
        - email
      additionalProperties: false
    PasswordResetRequestedResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - reset_requested
      required:
        - status
      additionalProperties: false
    ResetPasswordRequestDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        code:
          type: string
          pattern: ^\d{6}$
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - email
        - code
        - newPassword
      additionalProperties: false
    PasswordChangedResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - password_changed
      required:
        - status
      additionalProperties: false
    MfaStatusResponseDto:
      type: object
      properties:
        isEnabled:
          type: boolean
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - isEnabled
        - recoveryCodesRemaining
      additionalProperties: false
    MfaSetupRequestDto:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - password
      additionalProperties: false
    MfaSetupResponseDto:
      type: object
      properties:
        secret:
          type: string
        provisioningUri:
          type: string
      required:
        - secret
        - provisioningUri
      additionalProperties: false
    MfaConfirmRequestDto:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
        - code
      additionalProperties: false
    MfaConfirmResponseDto:
      type: object
      properties:
        recoveryCodes:
          minItems: 10
          maxItems: 10
          type: array
          items:
            type: string
      required:
        - recoveryCodes
      additionalProperties: false
    MfaProofRequestDto:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
          minLength: 8
          maxLength: 24
      required:
        - password
      additionalProperties: false
    RegeneratedRecoveryCodesResponseDto:
      type: object
      properties:
        recoveryCodes:
          minItems: 10
          maxItems: 10
          type: array
          items:
            type: string
      required:
        - recoveryCodes
      additionalProperties: false
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          nullable: true
        locale:
          type: string
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - email
        - fullName
        - phone
        - birthDate
        - locale
        - isEmailVerified
        - createdAt
      additionalProperties: false
    UpdateProfileRequestDto:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[\d\s()-]{6,20}$
          nullable: true
        birthDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          nullable: true
        locale:
          type: string
          enum:
            - es-ES
            - en
      additionalProperties: false
    MyMembershipsResponseDto:
      type: object
      properties:
        memberships:
          type: array
          items:
            type: object
            properties:
              membershipId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              centerId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - staff
                  - client
              status:
                type: string
                enum:
                  - invited
                  - active
                  - blocked
                  - left
              joinedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              center:
                type: object
                properties:
                  name:
                    type: string
                  slug:
                    type: string
                  sectorId:
                    type: string
                  brandColor:
                    type: string
                required:
                  - name
                  - slug
                  - sectorId
                  - brandColor
                additionalProperties: false
            required:
              - membershipId
              - centerId
              - role
              - status
              - joinedAt
              - center
            additionalProperties: false
      required:
        - memberships
      additionalProperties: false
    MyConsentsResponseDto:
      type: object
      properties:
        consents:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - privacy
                  - terms
                  - marketing
                  - health
                  - image
                  - parental
              version:
                type: string
              isGranted:
                type: boolean
              grantedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            required:
              - kind
              - version
              - isGranted
              - grantedAt
            additionalProperties: false
      required:
        - consents
      additionalProperties: false
    SetConsentRequestDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - marketing
            - image
        isGranted:
          type: boolean
      required:
        - kind
        - isGranted
      additionalProperties: false
    ChangePasswordRequestDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    ExportDataRequestDto:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - password
      additionalProperties: false
    PersonalDataExportResponseDto:
      type: object
      properties:
        exportedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            email:
              type: string
            fullName:
              type: string
            phone:
              type: string
              nullable: true
            birthDate:
