openapi: 3.0.0
paths:
  /v1/auth/register:
    post:
      operationId: auth_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSentResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Crea una cuenta y envía un código de 6 dígitos al correo. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/email/verify:
    post:
      operationId: auth_verify_email
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerifiedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Confirma el correo con el código de 6 dígitos (5 intentos, 15 minutos).
      tags:
        - auth
  /v1/auth/email/resend:
    post:
      operationId: auth_resend_email_verification
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendEmailVerificationRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSentResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Reenvía el código. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: auth_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MfaLoginResponseDto"
                  - $ref: "#/components/schemas/MfaChallengeResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: "Inicia sesión con correo y contraseña. Un correo inexistente, una contraseña errónea y una cuenta bloqueada responden igual. Con segundo factor activo devuelve un desafío (`status: mfa_required`) en lugar de la sesión."
      tags:
        - auth
  /v1/auth/mfa/verify:
    post:
      operationId: auth_verify_mfa
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaLoginResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Completa el inicio de sesión con el código de la app de autenticación o un código de recuperación. Cada código de la app sirve una sola vez.
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: auth_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Rota el refresh token y devuelve tokens nuevos. Reutilizar un token ya rotado revoca toda la sesión de ese dispositivo. Conserva el nivel de autenticación de la sesión (con o sin segundo factor).
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: auth_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cierra la sesión de este dispositivo, o de todos con `everywhere`.
      tags:
        - auth
  /v1/me/sessions/list:
    post:
      operationId: me_list_sessions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListOpenSessionsRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Dispositivos con sesión abierta. Se envía el refresh token de este dispositivo (nunca en la URL) para marcar cuál es esta sesión.
      tags:
        - me
  /v1/me/sessions/{sessionId}/revoke:
    post:
      operationId: me_revoke_session
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cierra la sesión de un dispositivo propio. Una sesión ajena o desconocida responde 404.
      tags:
        - me
  /v1/auth/password/forgot:
    post:
      operationId: auth_forgot_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequestDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Envía un código de 6 dígitos para cambiar la contraseña. Responde igual exista o no la cuenta.
      tags:
        - auth
  /v1/auth/password/reset:
    post:
      operationId: auth_reset_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Cambia la contraseña con el código (30 minutos, 5 intentos) y cierra la sesión en todos los dispositivos.
      tags:
        - auth
  /v1/me/mfa:
    get:
      operationId: mfa_get_status
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Si el segundo factor está activo y cuántos códigos de recuperación quedan.
      tags:
        - mfa
  /v1/me/mfa/totp/setup:
    post:
      operationId: mfa_setup_totp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaSetupRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: "Empieza a configurar la app de autenticación: devuelve el secreto y el URI para el QR. No cuenta hasta confirmarlo."
      tags:
        - mfa
  /v1/me/mfa/totp/confirm:
    post:
      operationId: mfa_confirm_totp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Activa el segundo factor con el primer código de la app y entrega diez códigos de recuperación (una sola vez).
      tags:
        - mfa
  /v1/me/mfa/disable:
    post:
      operationId: mfa_disable
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaProofRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Desactiva el segundo factor. Pide la contraseña y un código. No disponible para propietarias y administradoras.
      tags:
        - mfa
  /v1/me/mfa/recovery-codes/regenerate:
    post:
      operationId: mfa_regenerate_recovery_codes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaProofRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegeneratedRecoveryCodesResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Sustituye los códigos de recuperación por diez nuevos. Pide la contraseña y un código.
      tags:
        - mfa
  /v1/me:
    get:
      operationId: me_get_profile
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Mi perfil.
      tags:
        - me
    patch:
      operationId: me_update_profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia mi nombre, teléfono, fecha de nacimiento o idioma. El correo no se cambia aquí.
      tags:
        - me
    delete:
      operationId: me_delete_account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequestDto"
      responses:
        "204":
          description: ""
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Elimina mi cuenta (Apple 5.1.1(v), RGPD art. 17). Pide la contraseña y escribir ELIMINAR. Irreversible.
      tags:
        - me
  /v1/me/memberships:
    get:
      operationId: me_list_memberships
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMembershipsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Mis centros, con su marca, para cambiar de centro.
      tags:
        - me
  /v1/me/consents:
    get:
      operationId: me_get_consents
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyConsentsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: El estado vigente de cada consentimiento.
      tags:
        - me
    put:
      operationId: me_set_consent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetConsentRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyConsentsResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Concede o retira un consentimiento opcional (marketing, imagen). Queda constancia de cada cambio.
      tags:
        - me
  /v1/me/password:
    post:
      operationId: me_change_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia la contraseña (pide la actual) y cierra la sesión en todos los dispositivos, este incluido.
      tags:
        - me
  /v1/me/data-export:
    post:
      operationId: me_export_data
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDataRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataExportResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Descarga todos mis datos en JSON (RGPD arts. 15 y 20). Pide la contraseña.
      tags:
        - me
  /v1/join/code/{code}:
    get:
      operationId: join_find_center_by_code
      parameters:
        - name: code
          required: true
          in: path
          schema:
            minLength: 1
            maxLength: 16
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: El centro que corresponde a un código de unión. Un código desconocido responde 404 JOIN_CODE_INVALID.
      tags:
        - join
  /v1/join/search:
    get:
      operationId: join_search_centers
      parameters:
        - name: q
          required: false
          in: query
          schema:
            minLength: 2
            maxLength: 80
            type: string
        - name: lat
          required: false
          in: query
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: lng
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterSearchResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Busca entre los centros que salen en el directorio, por texto y, si se envía ubicación, por cercanía.
      tags:
        - join
  /v1/join/{centerId}:
    post:
      operationId: join_center
      parameters:
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCenterRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Te une al centro como cliente. Un centro privado exige su código de unión; uno listado, no. Comprueba el límite de clientes del plan.
      tags:
        - join
  /v1/onboarding/centers:
    post:
      operationId: onboarding_create_center
      parameters:
        - name: Idempotency-Key
          in: header
          description: UUID por intención del usuario
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCenterRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCenterResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Da de alta un centro en prueba de 14 días; quien lo crea queda como propietario. Repetir la misma Idempotency-Key devuelve el mismo centro.
      tags:
        - onboarding
  /v1/onboarding/centers/{centerId}/logo:
    put:
      operationId: onboarding_upload_center_logo
      parameters:
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCenterLogoRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCenterLogoResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: "Sube (o sustituye) el logo del centro: PNG, JPEG o WebP de hasta 700 KB en base64. Solo su propietario; para el resto, 404."
      tags:
        - onboarding
  /v1/centers/{centerId}/team:
    get:
      operationId: team_list
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Quienes trabajan en el centro.
      tags:
        - team
  /v1/centers/{centerId}/team/{membershipId}:
    patch:
      operationId: team_update_member
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: membershipId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberResponseDto"
        default:
          description: Error RFC 9457
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      security:
        - bearer: []
      summary: Cambia rol, permisos, cargo o estado de alguien del equipo. La propietaria no se toca; solo ella gestiona administradoras.
      tags:
        - team
  /v1/centers/{centerId}/invitations:
    get:
      operationId: invitations_list_pending
      parameters:
        - name: X-Center-Id
          in: header
          required: true
          schema:
            type: string
        - name: centerId
          required: true
          in: path
          schema:
            format: uuid
